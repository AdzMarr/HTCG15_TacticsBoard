<script>
(()=>{const $=id=>document.getElementById(id),pitch=$('pitch'),canvas=$('drawing'),ctx=canvas.getContext('2d');let pieces=[],drawings=[],selected=null,mode=null,start=null,points=[],history=[],future=[];const formations={'11':{'4-3-3':[[7,50,'1 GK'],[24,17,'2 RB'],[24,39,'4 RCB'],[24,61,'5 LCB'],[24,83,'3 LB'],[46,27,'8 RCM'],[44,50,'6 CM'],[46,73,'10 LCM'],[68,18,'7 RW'],[76,50,'9 ST'],[68,82,'11 LW']],'4-4-2':[[7,50,'1 GK'],[24,17,'2 RB'],[24,39,'4 RCB'],[24,61,'5 LCB'],[24,83,'3 LB'],[47,17,'7 RM'],[45,39,'8 RCM'],[45,61,'6 LCM'],[47,83,'11 LM'],[73,38,'9 ST'],[73,62,'10 ST']],'4-2-3-1':[[7,50,'1 GK'],[24,17,'2 RB'],[24,39,'4 RCB'],[24,61,'5 LCB'],[24,83,'3 LB'],[41,38,'6 DM'],[41,62,'8 DM'],[61,18,'7 RW'],[61,50,'10 AM'],[61,82,'11 LW'],[78,50,'9 ST']],'3-5-2':[[7,50,'1 GK'],[25,28,'4 RCB'],[23,50,'5 CB'],[25,72,'3 LCB'],[46,14,'2 RWB'],[46,34,'8 RCM'],[44,50,'6 CM'],[46,66,'10 LCM'],[46,86,'7 LWB'],[75,38,'9 ST'],[75,62,'11 ST']]},'9':{'3-3-2':[[8,50,'1 GK'],[28,22,'2 RB'],[25,50,'4 CB'],[28,78,'3 LB'],[51,24,'7 RM'],[48,50,'6 CM'],[51,76,'11 LM'],[75,37,'9 ST'],[75,63,'10 ST']],'3-2-3':[[8,50,'1 GK'],[28,22,'2 RB'],[25,50,'4 CB'],[28,78,'3 LB'],[48,37,'6 CM'],[48,63,'8 CM'],[72,20,'7 RW'],[78,50,'9 ST'],[72,80,'11 LW']],'2-4-2':[[8,50,'1 GK'],[27,35,'4 RCB'],[27,65,'5 LCB'],[50,16,'2 RM'],[47,39,'8 RCM'],[47,61,'6 LCM'],[50,84,'3 LM'],[75,38,'9 ST'],[75,62,'10 ST']]}};function uid(){return'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function msg(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}function state(){return JSON.stringify({pieces,drawings,title:$('title').value,notes:$('notes').value,view:$('view').value})}function commit(){history.push(state());if(history.length>60)history.shift();future=[];buttons()}function restore(s){const d=JSON.parse(s);pieces=d.pieces||[];drawings=d.drawings||[];$('title').value=d.title||'New tactical drill';$('notes').value=d.notes||'';$
