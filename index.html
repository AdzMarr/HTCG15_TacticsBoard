<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Responsive football tactics board for Holytown Colts">
  <link rel="manifest" href="manifest.json">
  <title>Holytown Colts Playbook</title>
  <style>
    :root{--navy:#0f172a;--panel:#172033;--panel2:#24324b;--line:#40516d;--text:#f8fafc;--muted:#cbd5e1;--accent:#fbbf24;--pitch:#287b41;--pitch2:#236f3a;--danger:#ef4444;--gk:#22c55e;--red:#e11d48;--yellow:#facc15;--blue:#2563eb;--pink:#ec4899;--purple:#8b5cf6}
    *{box-sizing:border-box}body{margin:0;background:#0b1220;color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100dvh}button,select,input,textarea{font:inherit}button{color:inherit;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
    .app{display:grid;grid-template-columns:245px minmax(0,1fr) 290px;min-height:100dvh}.sidebar{background:var(--navy);padding:16px;border-right:1px solid #334155;overflow:auto}.rightbar{border-left:1px solid #334155;border-right:0}.brand{display:flex;gap:10px;align-items:center;margin:0 0 16px}.brand h1{font-size:1.05rem;margin:0}.brand small{color:var(--muted)}h2{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:#94a3b8;margin:18px 0 8px}.toolbar{display:grid;gap:7px}.btn{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:9px 10px;text-align:left;transition:.15s}.btn:hover,.btn.active{background:#344766;border-color:#8eb6ed}.btn.primary{background:#1d4ed8;border-color:#60a5fa}.btn.danger{border-color:#7f1d1d;color:#fecaca}.field{display:grid;gap:4px;margin:9px 0}.field label{font-size:.75rem;color:var(--muted)}input,select,textarea{width:100%;background:#0b1220;border:1px solid var(--line);border-radius:8px;padding:8px;color:var(--text)}textarea{min-height:100px;resize:vertical}.hint{font-size:.76rem;color:#94a3b8;line-height:1.4}
    main{min-width:0;display:flex;flex-direction:column}.topbar{background:var(--navy);min-height:62px;display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid #334155}.title{flex:1;max-width:400px}.status{font-size:.75rem;color:#94a3b8;white-space:nowrap}.pitch-wrap{flex:1;min-height:0;display:grid;place-items:center;padding:16px;overflow:auto}.pitch{position:relative;width:min(100%,1050px);aspect-ratio:1.55/1;border:5px solid #fff;border-radius:7px;overflow:hidden;touch-action:none;background:repeating-linear-gradient(90deg,var(--pitch) 0 12.5%,var(--pitch2) 12.5% 25%)}
    .pitch:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 49.65%,#fff 49.65% 50.35%,transparent 50.35%)}.centre-circle{position:absolute;width:18%;aspect-ratio:1;left:41%;top:41%;border:3px solid #fff;border-radius:50%}.centre-dot{position:absolute;width:7px;height:7px;border-radius:50%;background:#fff;left:50%;top:50%;transform:translate(-50%,-50%)}.penalty{position:absolute;left:0;top:28%;height:44%;width:14%;border:3px solid #fff;border-left:0}.penalty.right{left:auto;right:0;border-left:3px solid #fff;border-right:0}.six{position:absolute;left:0;top:38.5%;height:23%;width:5%;border:3px solid #fff;border-left:0}.six.right{left:auto;right:0;border-left:3px solid #fff;border-right:0}.spot{position:absolute;width:7px;height:7px;border-radius:50%;background:#fff;top:50%;left:10.5%;transform:translateY(-50%)}.spot.right{left:auto;right:10.5%}
    #drawing{position:absolute;inset:0;z-index:4;pointer-events:none}.object{position:absolute;z-index:6;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;transform:translate(-50%,-50%);user-select:none;touch-action:none;border:2px solid rgba(255,255,255,.92);box-shadow:0 2px 7px #0008;font-weight:800;color:#fff}.object.red{background:var(--red)}.object.yellow{background:var(--yellow);color:#3f3100}.object.blue{background:var(--blue)}.object.pink{background:var(--pink)}.object.purple{background:var(--purple)}.object.gk{background:var(--gk);color:#052e16}.object.selected{outline:4px solid var(--accent);outline-offset:2px}.number{font-size:.88rem;line-height:1}.label{position:absolute;top:calc(100% + 5px);left:50%;transform:translateX(-50%);white-space:nowrap;background:#0f172ae8;color:#fff;padding:2px 5px;border-radius:4px;font-size:10px;font-weight:700;pointer-events:none}.marker{width:25px;height:25px;border-radius:50%;box-shadow:none;border:1px solid rgba(255,255,255,.75)}.marker.red{background:var(--red)}.marker.yellow{background:var(--yellow)}.marker.blue{background:var(--blue)}.marker.pink{background:var(--pink)}.marker.purple{background:var(--purple)}.ball{width:14px;height:14px;border-radius:50%;background:#fff;border:1px solid #111;box-shadow:0 1px 2px #000a;overflow:hidden}.ball:before{content:"";position:absolute;width:6px;height:6px;left:3px;top:3px;background:#111;clip-path:polygon(50% 0,100% 35%,82% 100%,18% 100%,0 35%)}.ball:after{content:"";position:absolute;inset:1px;border-radius:50%;background:conic-gradient(from 15deg,transparent 0 13%,#111 13% 17%,transparent 17% 32%,#111 32% 36%,transparent 36% 52%,#111 52% 56%,transparent 56% 70%,#111 70% 74%,transparent 74%);opacity:.85}
    .bottom{background:var(--navy);border-top:1px solid #334155;padding:9px 14px;display:flex;gap:8px;align-items:center}.bottom button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}.spacer{flex:1}.mobile-tools{display:none}.toast{position:fixed;z-index:50;left:50%;bottom:18px;transform:translate(-50%,110px);background:#e2e8f0;color:#0f172a;padding:9px 14px;border-radius:8px;font-weight:700;transition:.22s}.toast.show{transform:translate(-50%,0)}body.presentation .sidebar,body.presentation .rightbar,body.presentation .topbar,body.presentation .bottom{display:none}body.presentation .app{display:block}body.presentation .pitch-wrap{height:100dvh;padding:8px}body.presentation .pitch{width:min(100%,1450px)}
    @media(max-width:980px){.app{grid-template-columns:1fr}.sidebar,.rightbar{display:none}.topbar{position:sticky;top:0;z-index:20}.mobile-tools{display:flex;position:sticky;top:62px;z-index:19;overflow-x:auto}.mobile-tools button{min-width:43px}.pitch-wrap{padding:10px}.pitch{width:100%}.bottom:last-child{position:sticky;bottom:0;z-index:20;overflow-x:auto}.status{display:none}}@media(max-width:520px){.topbar{padding:8px;gap:5px}.topbar .btn{padding:8px;font-size:.8rem}.topbar .btn:not(.primary){display:none}.title{min-width:0}.bottom{padding:7px;gap:5px}.bottom button{padding:8px;font-size:.78rem}.bottom #duplicateBtn{display:none}.object{width:34px;height:34px}.marker{width:23px;height:23px}.pitch-wrap{align-items:start}.label{font-size:9px}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span>⚽</span><div><h1>Holytown Colts</h1><small>Tactics Playbook</small></div></div>
    <h2>Add movable items</h2><div class="toolbar"><button class="btn" data-add="red">🔴 Red player</button><button class="btn" data-add="yellow">🟡 Yellow player</button><button class="btn" data-add="blue">🔵 Blue player</button><button class="btn" data-add="pink">🩷 Pink player</button><button class="btn" data-add="purple">🟣 Purple player</button><button class="btn" data-add="gk">🟢 Goalkeeper</button><button class="btn" data-add="marker-red">● Flat marker</button><button class="btn" data-add="ball">⚽ Football</button></div>
    <h2>Drawing tools</h2><div class="toolbar"><button class="btn" id="freehandBtn">✏️ Freehand line</button><button class="btn" id="arrowBtn">➜ Arrow</button><button class="btn" id="clearLines">🧹 Clear drawings</button></div>
    <p class="hint">Select an item, then drag it on the pitch. In drawing mode, drag anywhere on the pitch. Press Escape to leave drawing mode.</p>
  </aside>
  <main>
    <header class="topbar"><input id="drillTitle" class="title" value="New tactical drill" aria-label="Drill title"><button class="btn primary" id="saveBtn">💾 Save</button><button class="btn" id="loadBtn">📂 Load</button><button class="btn" id="exportBtn">⇩ JSON</button><button class="btn" id="importBtn">⇧ Import</button><input id="fileInput" type="file" accept="application/json" hidden><button class="btn" id="presentBtn" title="Presentation mode">⛶</button><span class="status" id="status">Ready</span></header>
    <div class="mobile-tools bottom"><button data-add="red">🔴</button><button data-add="yellow">🟡</button><button data-add="blue">🔵</button><button data-add="gk">🟢</button><button data-add="marker-red">●</button><button data-add="ball">⚽</button><button id="mobileFreehand">✏️</button><button id="mobileArrow">➜</button><span class="spacer"></span><button id="mobileUndo">↶</button><button id="mobileRedo">↷</button></div>
    <div class="pitch-wrap"><div id="pitch" class="pitch" aria-label="Football tactics pitch"><div class="centre-circle"></div><div class="centre-dot"></div><div class="penalty"></div><div class="penalty right"></div><div class="six"></div><div class="six right"></div><div class="spot"></div><div class="spot right"></div><canvas id="drawing"></canvas></div></div>
    <footer class="bottom"><button id="undoBtn">↶ Undo</button><button id="redoBtn">↷ Redo</button><button id="deleteBtn" class="danger">Delete</button><button id="duplicateBtn">Duplicate</button><span class="spacer"></span><button id="clearBoard" class="danger">Clear board</button></footer>
  </main>
  <aside class="sidebar rightbar">
    <h2>Formations</h2><div class="field"><label for="squadSize">Team size</label><select id="squadSize"><option value="9">9 v 9</option><option value="11" selected>11 v 11</option></select></div><div class="field"><label for="formation">Formation</label><select id="formation"></select></div><div class="field"><label for="formationColour">Team shirt colour</label><select id="formationColour"><option value="red">Red</option><option value="yellow">Yellow</option><option value="blue">Blue</option><option value="pink">Pink</option><option value="purple">Purple</option></select></div><button class="btn primary" id="applyFormation">Apply formation</button>
    <h2>Drawing style</h2><div class="field"><label for="drawColour">Colour</label><select id="drawColour"><option value="#ffffff">White</option><option value="#fbbf24">Yellow</option><option value="#ef4444">Red</option><option value="#3b82f6">Blue</option><option value="#ec4899">Pink</option><option value="#a855f7">Purple</option><option value="#111827">Black</option></select></div><div class="field"><label for="drawStyle">Line style</label><select id="drawStyle"><option value="solid">Solid</option><option value="dash">Dashed</option></select></div><div class="field"><label for="drawWidth">Line thickness</label><select id="drawWidth"><option value="2">Thin</option><option value="4" selected>Medium</option><option value="6">Thick</option></select></div>
    <h2>Selected item</h2><div id="noSelection" class="hint">Tap/click an item to select it.</div><div id="selectionPanel" hidden><div class="field"><label for="objectLabel">Name / shirt number</label><input id="objectLabel" maxlength="20" placeholder="e.g. 10 - Striker"></div><div class="field"><label for="objectType">Item colour/type</label><select id="objectType"><option value="red">Red player</option><option value="yellow">Yellow player</option><option value="blue">Blue player</option><option value="pink">Pink player</option><option value="purple">Purple player</option><option value="gk">Green goalkeeper</option><option value="marker-red">Red flat marker</option><option value="marker-yellow">Yellow flat marker</option><option value="marker-blue">Blue flat marker</option><option value="marker-pink">Pink flat marker</option><option value="marker-purple">Purple flat marker</option><option value="ball">Football</option></select></div><button id="saveObject" class="btn primary">Update item</button></div>
    <h2>Drill notes</h2><textarea id="notes" placeholder="Aim, organisation, coaching points…"></textarea>
  </aside>
</div>
<div class="toast" id="toast"></div>
<script>
(()=>{
const pitch=document.getElementById('pitch'),canvas=document.getElementById('drawing'),ctx=canvas.getContext('2d');
const title=document.getElementById('drillTitle'),notes=document.getElementById('notes'),objectLabel=document.getElementById('objectLabel'),objectType=document.getElementById('objectType'),selectionPanel=document.getElementById('selectionPanel'),noSelection=document.getElementById('noSelection');
let objects=[],drawings=[],selected=null,mode=null,start=null,currentPoints=[],history=[],future=[];
const formData={
 '11':{'4-3-3':[[7,50,'1 GK'],[24,17,'2 RB'],[24,39,'4 RCB'],[24,61,'5 LCB'],[24,83,'3 LB'],[46,27,'8 RCM'],[44,50,'6 CM'],[46,73,'10 LCM'],[68,18,'7 RW'],[76,50,'9 ST'],[68,82,'11 LW']],'4-4-2':[[7,50,'1 GK'],[24,17,'2 RB'],[24,39,'4 RCB'],[24,61,'5 LCB'],[24,83,'3 LB'],[47,17,'7 RM'],[45,39,'8 RCM'],[45,61,'6 LCM'],[47,83,'11 LM'],[73,38,'9 ST'],[73,62,'10 ST']],'4-2-3-1':[[7,50,'1 GK'],[24,17,'2 RB'],[24,39,'4 RCB'],[24,61,'5 LCB'],[24,83,'3 LB'],[41,38,'6 DM'],[41,62,'8 DM'],[61,18,'7 RW'],[61,50,'10 AM'],[61,82,'11 LW'],[78,50,'9 ST']],'3-5-2':[[7,50,'1 GK'],[25,28,'4 RCB'],[23,50,'5 CB'],[25,72,'3 LCB'],[46,14,'2 RWB'],[46,34,'8 RCM'],[44,50,'6 CM'],[46,66,'10 LCM'],[46,86,'7 LWB'],[75,38,'9 ST'],[75,62,'11 ST']]},
 '9':{'3-3-2':[[8,50,'1 GK'],[28,22,'2 RB'],[25,50,'4 CB'],[28,78,'3 LB'],[51,24,'7 RM'],[48,50,'6 CM'],[51,76,'11 LM'],[75,37,'9 ST'],[75,63,'10 ST']],'3-2-3':[[8,50,'1 GK'],[28,22,'2 RB'],[25,50,'4 CB'],[28,78,'3 LB'],[48,37,'6 CM'],[48,63,'8 CM'],[72,20,'7 RW'],[78,50,'9 ST'],[72,80,'11 LW']],'2-4-2':[[8,50,'1 GK'],[27,35,'4 RCB'],[27,65,'5 LCB'],[50,16,'2 RM'],[47,39,'8 RCM'],[47,61,'6 LCM'],[50,84,'3 LM'],[75,38,'9 ST'],[75,62,'10 ST']]}
};
function uid(){return 'o'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function notify(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function state(){return JSON.stringify({objects,drawings,title:title.value,notes:notes.value})}function commit(){history.push(state());if(history.length>60)history.shift();future=[];buttons()}function restore(s){const d=JSON.parse(s);objects=d.objects||[];drawings=d.drawings||[];title.value=d.title||'New tactical drill';notes.value=d.notes||'';selected=null;render();buttons()}function buttons(){undoBtn.disabled=history.length<2;redoBtn.disabled=!future.length}function undo(){if(history.length<2)return;future.push(history.pop());restore(history.at(-1));notify('Undone')}function redo(){if(!future.length)return;const s=future.pop();history.push(s);restore(s);notify('Redone')}
function pos(e){const r=pitch.getBoundingClientRect();return{x:Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100)),y:Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100))}}function make(type,x=50,y=50,label=''){return{id:uid(),type,x,y,label}}
function kind(type){if(type.startsWith('marker-'))return'marker';if(type==='ball')return'ball';return'player'}function colour(type){return type.startsWith('marker-')?type.slice(7):type}
function add(type){objects.push(make(type));commit();render();select(objects.at(-1).id)}function select(id){selected=objects.find(x=>x.id===id)||null;selectionPanel.hidden=!selected;noSelection.hidden=!!selected;if(selected){objectLabel.value=selected.label||'';objectType.value=selected.type}render()}
function render(){pitch.querySelectorAll('.object').forEach(e=>e.remove());objects.forEach(o=>{const e=document.createElement('div');e.className='object '+kind(o.type)+' '+colour(o.type)+(selected?.id===o.id?' selected':'');e.style.left=o.x+'%';e.style.top=o.y+'%';e.dataset.id=o.id;if(kind(o.type)==='player'){const n=document.createElement('span');n.className='number';n.textContent=(o.label.match(/^\d+/)||[''])[0];e.appendChild(n)}if(o.label&&kind(o.type)!=='marker'){const l=document.createElement('span');l.className='label';l.textContent=o.label;e.appendChild(l)}e.addEventListener('pointerdown',dragStart);e.addEventListener('dblclick',()=>{select(o.id);objectLabel.focus();objectLabel.select()});pitch.appendChild(e)});paint()}
function dragStart(e){if(mode)return;e.preventDefault();const el=e.currentTarget,o=objects.find(x=>x.id===el.dataset.id);select(o.id);el.setPointerCapture(e.pointerId);const move=v=>{const p=pos(v);o.x=p.x;o.y=p.y;el.style.left=p.x+'%';el.style.top=p.y+'%'};const end=()=>{el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',end);commit();render()};el.addEventListener('pointermove',move);el.addEventListener('pointerup',end)}
function resize(){const r=pitch.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=r.width*d;canvas.height=r.height*d;canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';ctx.setTransform(d,0,0,d,0,0);paint()}function settings(){return{colour:drawColour.value,style:drawStyle.value,width:+drawWidth.value}}function paintPath(d){const r=pitch.getBoundingClientRect(),pts=d.points;if(!pts.length)return;ctx.save();ctx.strokeStyle=d.colour;ctx.lineWidth=d.width;ctx.lineCap='round';ctx.lineJoin='round';ctx.setLineDash(d.style==='dash'?[d.width*3,d.width*2]:[]);ctx.beginPath();ctx.moveTo(pts[0].x/100*r.width,pts[0].y/100*r.height);pts.slice(1).forEach(p=>ctx.lineTo(p.x/100*r.width,p.y/100*r.height));ctx.stroke();if(d.kind==='arrow'&&pts.length>1){const a=pts.at(-2),b=pts.at(-1),x1=a.x/100*r.width,y1=a.y/100*r.height,x2=b.x/100*r.width,y2=b.y/100*r.height,ang=Math.atan2(y2-y1,x2-x1),s=8+d.width;ctx.setLineDash([]);ctx.fillStyle=d.colour;ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-s*Math.cos(ang-Math.PI/6),y2-s*Math.sin(ang-Math.PI/6));ctx.lineTo(x2-s*Math.cos(ang+Math.PI/6),y2-s*Math.sin(ang+Math.PI/6));ctx.closePath();ctx.fill()}ctx.restore()}function paint(){const r=pitch.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);drawings.forEach(paintPath);if(start&&currentPoints.length)paintPath({...settings(),kind:mode,points:currentPoints})}
function setMode(m){mode=mode===m?null:m;canvas.style.pointerEvents=mode?'auto':'none';freehandBtn.classList.toggle('active',mode==='freehand');arrowBtn.classList.toggle('active',mode==='arrow');notify(mode?(mode==='arrow'?'Arrow mode':'Freehand mode'):'Selection mode')}
canvas.addEventListener('pointerdown',e=>{if(!mode)return;start=pos(e);currentPoints=[start];canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!start)return;const p=pos(e);if(mode==='freehand'){const q=currentPoints.at(-1);if(Math.hypot(p.x-q.x,p.y-q.y)>.5)currentPoints.push(p)}else currentPoints=[start,p];paint()});canvas.addEventListener('pointerup',e=>{if(!start)return;const p=pos(e);if(mode==='arrow')currentPoints=[start,p];if(currentPoints.length>1){drawings.push({...settings(),kind:mode,points:currentPoints});commit()}start=null;currentPoints=[];paint()});
function updateForms(){const size=squadSize.value,select=document.getElementById('formation');select.innerHTML='';Object.keys(formData[size]).forEach(f=>select.add(new Option(f,f)))}
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));freehandBtn.onclick=()=>setMode('freehand');arrowBtn.onclick=()=>setMode('arrow');mobileFreehand.onclick=()=>setMode('freehand');mobileArrow.onclick=()=>setMode('arrow');
clearLines.onclick=()=>{if(!drawings.length)return;drawings=[];commit();render();notify('Drawings cleared')};clearBoard.onclick=()=>{if(confirm('Clear every item and drawing?')){objects=[];drawings=[];selected=null;commit();render();notify('Board cleared')}};deleteBtn.onclick=()=>{if(!selected)return;objects=objects.filter(x=>x.id!==selected.id);selected=null;commit();render()};duplicateBtn.onclick=()=>{if(!selected)return;const c={...selected,id:uid(),x:Math.min(97,selected.x+4),y:Math.min(97,selected.y+4)};objects.push(c);commit();select(c.id)};saveObject.onclick=()=>{if(!selected)return;selected.label=objectLabel.value.trim();selected.type=objectType.value;commit();render()};
squadSize.onchange=updateForms;applyFormation.onclick=()=>{const team=formData[squadSize.value][formation.value],shirt=formationColour.value;if(!team)return;objects=objects.filter(o=>!(kind(o.type)==='player'&&(colour(o.type)===shirt||o.type==='gk')));team.forEach(p=>objects.push(make(p[2].includes('GK')?'gk':shirt,p[0],p[1],p[2])));drawings=[];selected=null;commit();render();notify(`${squadSize.value}v${squadSize.value} ${formation.value} applied`)};
function saved(){try{return JSON.parse(localStorage.getItem('htcg15-drills')||'[]')}catch{return[]}}saveBtn.onclick=()=>{const all=saved(),entry={name:title.value.trim()||'Untitled drill',savedAt:new Date().toISOString(),data:JSON.parse(state())},i=all.findIndex(x=>x.name===entry.name);if(i>=0)all[i]=entry;else all.unshift(entry);localStorage.setItem('htcg15-drills',JSON.stringify(all.slice(0,40)));status.textContent='Saved';notify('Drill saved on this device')};loadBtn.onclick=()=>{const all=saved();if(!all.length)return notify('No saved drills yet');const choice=prompt('Enter the drill number to load:\n\n'+all.map((d,i)=>`${i+1}. ${d.name}`).join('\n'));const d=all[+choice-1];if(d){restore(JSON.stringify(d.data));commit();notify('Drill loaded')}};exportBtn.onclick=()=>{const a=document.createElement('a'),blob=new Blob([JSON.stringify(JSON.parse(state()),null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download=(title.value.replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'')||'tactics-drill')+'.json';a.click();URL.revokeObjectURL(a.href)};importBtn.onclick=()=>fileInput.click();fileInput.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{restore(r.result);commit();notify('Drill imported')}catch{notify('Invalid drill file')}};r.readAsText(f);e.target.value=''};presentBtn.onclick=()=>{document.body.classList.toggle('presentation');resize()};undoBtn.onclick=undo;redoBtn.onclick=redo;mobileUndo.onclick=undo;mobileRedo.onclick=redo;
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}else if((e.key==='Delete'||e.key==='Backspace')&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName))deleteBtn.click();else if(e.key==='Escape'&&mode)setMode(null)});window.addEventListener('resize',resize);updateForms();commit();render();resize();
})();
</script>
</body>
</html>
